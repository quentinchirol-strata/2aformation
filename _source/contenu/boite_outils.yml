  comment:
  - "Afficher l'infographie dans le bureau éducatif."
  - "Analyser chaque incident en équipe à l'aide des repères du chapitre consacré à la gestion de la violence."
- id: 3-6-9-12
  cat: numerique
  titre: Les repères 3-6-9-12 pour apprivoiser les écrans
  auteur: Serge Tisseron, association 3-6-9-12+
  type: Repères d'âge, affiches et quiz
  public: Parents, professionnels de l'enfance
  image: 3-6-9-12.jpg
  lien: https://www.3-6-9-12.org/les-balises-3-6-9-12/
  lien_label: Site 3-6-9-12
  quoi: "Des repères simples par âge : pas d'écran avant 3 ans, des temps courts et partagés de 3 à 6 ans, apprendre à créer et à se protéger de 6 à 9 ans, à s'autoréguler de 9 à 12 ans, puis l'accompagnement des réseaux sociaux."
  quand: "Quand un parent demande « combien de temps d'écran ? », ou pour fixer les règles d'un lieu de vie."
  comment:
  - "Afficher l'affiche ou remettre le dépliant aux parents."
  - "Faire le quiz en famille ou en groupe d'enfants."
- id: santebd
  cat: droits
  titre: SantéBD – expliquer les soins avec des images
  auteur: Association CoActis Santé
  type: Bandes dessinées, fiches FALC et banque d'images
  public: Enfants, personnes en situation de handicap, professionnels
  lien: https://santebd.org/
  lien_label: santebd.org
  quoi: "Des bandes dessinées et des fiches gratuites, en langage simple, pour préparer une consultation ou un soin (dentiste, vaccin, prise de sang…), et une banque de plus de 20 000 images. On y trouve aussi des fiches FALC, par exemple « Comprendre et arrêter la maltraitance »."
  quand: "Avant un rendez-vous médical qui inquiète un enfant ou une personne accompagnée."
  comment:
  - "Lire la bande dessinée avec la personne quelques jours avant le soin."
  - "Utiliser la banque d'images pour fabriquer ses propres supports (planning, règles de vie)."
- id: mes-droits-sociaux
  cat: acces-droits
  titre: Mes droits sociaux – le simulateur des aides
  auteur: Site public de la Sécurité sociale (mesdroitssociaux.gouv.fr)
  type: Simulateur en ligne
  public: Personnes et familles accompagnées, avec un professionnel
  lien: https://www.mesdroitssociaux.gouv.fr/
  lien_label: mesdroitssociaux.gouv.fr
  quoi: "Un simulateur qui indique en quelques minutes les aides auxquelles une personne peut prétendre (RSA, aides au logement, prime d'activité…) et un espace pour retrouver ses droits en un seul endroit."
  quand: "Au premier entretien avec une famille ou un jeune majeur, ou dès que la situation change (naissance, séparation, perte d'emploi)."
  comment:
  - "Faire la simulation avec la personne, écran partagé, puis lister ensemble les démarches à engager."
  - "Rappel : c'est une estimation ; seul l'organisme payeur décide."
- id: 1jeune1solution
  cat: acces-droits
  titre: 1 jeune 1 solution
  auteur: Gouvernement
  type: Plateforme (aides, emploi, accompagnement)
  public: Jeunes de 15 à 30 ans
  lien: https://www.1jeune1solution.gouv.fr/
  lien_label: 1jeune1solution.gouv.fr
  quoi: "Un simulateur d'aides (logement, santé, mobilité, emploi), le contrat d'engagement jeune, des offres d'emploi, de stage et d'apprentissage, du mentorat et une aide au permis de conduire."
  quand: "Pour préparer la sortie de l'aide sociale à l'enfance ou accompagner un jeune sans solution."
  comment:
  - "Faire le simulateur d'aides avec le jeune, puis choisir avec lui une ou deux pistes concrètes."
- id: mon-parcours-handicap
  cat: acces-droits
  titre: Mon parcours handicap
  auteur: CNSA, avec la Caisse des dépôts
  type: Site d'information et de démarches
  public: Familles, personnes en situation de handicap, professionnels
  lien: https://www.monparcourshandicap.gouv.fr/
  lien_label: monparcourshandicap.gouv.fr
  quoi: "Les démarches auprès de la MDPH, les principales aides (AAH, AEEH, PCH, CMI, RQTH), les formulaires à télécharger, des vidéos et des fiches en « Facile à lire et à comprendre »."
  quand: "Pour constituer ou renouveler un dossier MDPH avec une famille, ou expliquer une aide."
  comment:
  - "Ouvrir la fiche de l'aide concernée avec la famille et préparer ensemble les pièces du dossier."
- id: allo-119
  cat: danger
  titre: Le 119 – Allô enfance en danger
  auteur: Service national d'accueil téléphonique de l'enfance en danger
  type: Numéro d'urgence et tchat
  public: Enfants, adolescents, adultes inquiets, professionnels
  lien: https://www.allo119.gouv.fr/
  lien_label: allo119.gouv.fr
  quoi: "Un numéro gratuit, joignable 24 h/24 et 7 j/7, qui n'apparaît sur aucun relevé téléphonique détaillé. Un tchat est ouvert aux jeunes jusqu'à 21 ans, et un accès est prévu pour les personnes sourdes ou malentendantes."
  quand: "Pour qu'un enfant ou un adulte puisse parler d'une situation de danger, et pour le faire connaître dans tous les lieux d'accueil."
  comment:
  - "Afficher le 119 à hauteur d'enfant dans les lieux de vie."
  - "Le présenter aux enfants accueillis comme une ressource à laquelle ils ont droit."
- id: cnil-protection-enfance
  cat: ecrits
  titre: Le référentiel « Protection de l'enfance » de la CNIL
  auteur: CNIL
  annee: 2022
  type: Référentiel
  public: Services et établissements de protection de l'enfance
  lien: https://cnil.fr/fr/protection-de-lenfance-et-des-majeurs-de-moins-de-21-ans-la-cnil-publie-un-referentiel
  lien_label: Page de la CNIL
  quoi: "Ce qu'un service a le droit d'enregistrer sur un enfant et sa famille, pour quelles raisons, combien de temps, et les droits des personnes (accès, rectification)."
  quand: "Avant d'écrire dans un dossier ou un logiciel : pour se demander si l'information est utile et légitime."
  comment:
  - "Relire en équipe la liste des données autorisées et la comparer aux habitudes d'écriture du service."
  - "Écrire chaque note en se disant que la famille peut demander à la lire."
- id: cnil-durees
  cat: ecrits
  titre: Les durées de conservation dans le secteur social et médico-social
  auteur: CNIL
  annee: 2023
  type: Référentiel (tableaux)
  public: Directions, secrétariats, équipes
  image: cnil-durees.jpg
  lien: https://www.cnil.fr/sites/cnil/files/2023-11/referentiel_durees_de_conservation_social_et_medico-social.pdf
  lien_label: Référentiel sur cnil.fr
  quoi: "Des tableaux qui indiquent, activité par activité (accompagnement social, protection de l'enfance, handicap…), combien de temps garder un dossier, et quand l'archiver, avec les textes de référence."
  quand: "Pour organiser l'archivage des dossiers ou répondre à la question « on garde ça combien de temps ? »."
  comment:
  - "Chercher la ligne qui correspond à l'activité du service et l'inscrire dans la procédure d'archivage."
- id: has-interpretariat
  cat: parcours
  titre: Interprétariat linguistique dans le domaine de la santé
  auteur: Haute Autorité de santé (HAS)
  annee: 2017
  type: Référentiel
  public: Professionnels du soin et du social
  lien: https://has-sante.fr/jcms/c_2746031/fr/interpretariat-linguistique-dans-le-domaine-de-la-sante
  lien_label: Page de la HAS
  quoi: "Le référentiel qui explique pourquoi recourir à un interprète professionnel, et pourquoi ne pas faire traduire par un enfant ou un proche (charge trop lourde, atteinte au secret)."
  quand: "Avec une famille ou un mineur qui ne parle pas français, avant un entretien important."
  comment:
  - "Prévoir un interprète professionnel, sur place ou par téléphone, pour les entretiens qui comptent."
  - "Ne jamais faire traduire un enfant pour ses parents."
- id: onsexprime
  cat: sexualite
  titre: OnSEXprime
  auteur: Santé publique France
  type: Site pour les adolescents
  public: Adolescents, et professionnels qui animent des séances
  lien: https://www.onsexprime.fr/
  lien_label: onsexprime.fr
  quoi: "Le site de référence sur la sexualité pour les ados : articles, vidéos et podcasts. Les professionnels y trouvent aussi des ressources pour construire des séances."
  quand: "Pour orienter un ado qui se pose des questions, ou préparer une séance."
  comment:
  - "Donner l'adresse au jeune : il peut s'informer seul, de façon fiable."
  - "Utiliser un podcast comme point de départ d'une discussion en groupe."
- id: questionsexualite
  cat: sexualite
  titre: QuestionSexualité
  auteur: Santé publique France
  type: Site d'information
  public: Adultes, parents, jeunes majeurs
  lien: https://www.questionsexualite.fr/
  lien_label: questionsexualite.fr
  quoi: "Des informations fiables sur les IST et le dépistage, la contraception, l'IVG, le corps, le consentement, les violences et les discriminations, avec vidéos et quiz."
  quand: "Pour répondre à la question d'un parent ou d'un jeune majeur, ou trouver un lieu de dépistage."
  comment:
  - "Ouvrir la fiche concernée avec la personne pendant l'entretien."
- id: laicite-structures-educatives
  cat: ethique
  titre: Laïcité et gestion du fait religieux dans les structures socio-éducatives
  auteur: Observatoire de la laïcité (supprimé en 2021)
  type: Guide pratique
  public: Équipes éducatives et socio-éducatives
  image: laicite-structures-educatives.jpg
  lien: "https://www.gironde.gouv.fr/contenu/telechargement/33436/237122/file/PREMIER%20MINISTRE%20LAICITE%20et%20FAIT%20RELIGIEUX%20DANS%20LES%20STRUCTURES%20EDUCATIVES.pdf"
  lien_label: Guide (copie sur gironde.gouv.fr)
  source_note: "L'Observatoire de la laïcité a été supprimé en 2021 : le guide reste en ligne sur le site de la préfecture de la Gironde."
  quoi: "Des repères et des cas pratiques sur l'expression religieuse des jeunes et des professionnels dans les structures socio-éducatives : ce que la loi permet, ce qu'elle interdit."
  quand: "Face à une question d'alimentation, de prière, de tenue ou de fêtes religieuses dans un lieu de vie."
  comment:
  - "Chercher le cas pratique le plus proche et le discuter en équipe avant de répondre au jeune ou à la famille."
- id: ssd-evaluation-ip
  cat: evaluation
  titre: Guide de l'évaluation des informations préoccupantes
  auteur: Département de la Seine-Saint-Denis
  annee: 2023
  type: Guide, trame et exemples de rapports
  public: Professionnels chargés d'évaluer une information préoccupante
  image: ssd-evaluation-ip.jpg
  lien: https://ressources.seinesaintdenis.fr/IMG/pdf/guideevaluationip_crip_ase_def_2023.pdf
  lien_label: Guide sur seinesaintdenis.fr
  quoi: "Un guide de 44 pages : cadre législatif, principes d'une évaluation en protection de l'enfance, évaluation partagée, contenu attendu des rapports. En annexe, la trame du rapport d'évaluation, sa notice d'utilisation et deux exemples de rapports (une famille qui ne s'est pas présentée, une famille en situation complexe)."
  quand: "Avant de mener ou de rédiger une évaluation d'information préoccupante, ou pour former une équipe à cet exercice."
  comment:
  - "S'appuyer sur la trame et sa notice pour structurer son rapport, puis comparer avec les deux exemples."
  - "C'est le guide d'un département : vérifier la trame en vigueur dans le vôtre, chaque cellule de recueil (CRIP) a ses propres modèles."
- id: reperage-tnd
  cat: evaluation
  titre: "Détecter les signes d'un développement inhabituel chez les enfants de moins de 7 ans"
  auteur: Délégation interministérielle à la stratégie nationale pour l'autisme au sein des troubles du neuro-développement
  annee: 2020
  type: Grille de repérage et formulaire d'adressage
  public: Médecins, et professionnels de la petite enfance qui les alertent
  image: reperage-tnd.jpg
  lien: https://handicap.gouv.fr/sites/handicap/files/2023-02/brochure_reperage_tnd_2020_formulaire.pdf
  lien_label: Brochure sur handicap.gouv.fr
  quoi: "Une grille de signes d'alerte par âge (6, 12, 18, 24 et 36 mois, puis 4, 5 et 6 ans) en motricité globale, motricité fine, langage, socialisation et, à partir de 4 ans, cognition. Elle se termine par un formulaire d'adressage vers une plateforme de coordination et d'orientation (PCO)."
  quand: "Quand le développement d'un jeune enfant interroge l'équipe (crèche, pouponnière, assistant familial, service d'accompagnement des familles)."
  comment:
  - "La grille est à remplir par le médecin. Elle aide l'équipe à structurer ses observations avant d'en parler avec les parents et le médecin."
  - "Un repérage n'est pas un diagnostic : l'objectif est d'orienter tôt vers un bilan."
- id: adbb
  cat: evaluation
  titre: Échelle Alarme détresse bébé (ADBB)
  auteur: Antoine Guedeney
  annee: 2012
  type: Échelle d'observation
  public: Professionnels de la petite enfance et du soin formés à l'observation
  lien: https://afpa.org/content/uploads/2017/08/adbb_2012_francais.pdf
  lien_label: Grille sur le site de l'AFPA
  source_note: "L'auteur ne publie pas l'échelle lui-même : le lien renvoie vers la version française mise en ligne par l'Association française de pédiatrie ambulatoire (AFPA)."
  quoi: "Une échelle de 8 items pour repérer le retrait relationnel du bébé : expression du visage, contact visuel, activité corporelle, gestes d'auto-stimulation, vocalisations, vivacité de la réaction, relation, attractivité. Chaque item est coté de 0 (pas de comportement de retrait) à 4 (comportement massivement anormal)."
  quand: "Quand un bébé paraît « trop sage », peu réactif ou en retrait, par exemple en pouponnière ou en visite à domicile."
  comment:
  - "La remplir juste après un temps d'observation, comme le prévoient les consignes ; en cas de doute, retenir la cotation la plus basse."
  - "Se former à la cotation avant de l'utiliser, et en parler avec le médecin ou le psychologue de l'équipe."
- id: aggir
  cat: evaluation
  titre: La grille nationale AGGIR
  auteur: Code de l'action sociale et des familles (annexe 2-1)
  type: Grille d'évaluation de l'autonomie
  public: Professionnels du soutien à domicile et des établissements pour personnes âgées
  lien: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000034696537/2017-05-11
  lien_label: Grille et guide de remplissage sur Légifrance
  quoi: "La grille officielle qui mesure la perte d'autonomie d'une personne âgée. Dix variables (cohérence, orientation, toilette, habillage, alimentation, élimination, transferts, déplacements, communication à distance) sont cotées A, B ou C et donnent le GIR, de 1 (le plus dépendant) à 6. Seuls les GIR 1 à 4 ouvrent droit à l'allocation personnalisée d'autonomie (APA)."
  quand: "Pour comprendre une évaluation APA, préparer une demande ou expliquer son GIR à une personne et à sa famille."
  comment:
  - "Lire le guide de remplissage : chaque activité est cotée selon qu'elle est faite seule, totalement, correctement et habituellement."
  - "Pour l'expliquer aux familles, le site pour-les-personnes-agees.gouv.fr propose une fiche « Comment fonctionne la grille AGGIR ? »."
- id: has-perte-autonomie
  cat: evaluation
  titre: Outil de repérage des risques de perte d'autonomie ou de son aggravation
  auteur: Anesm (aujourd'hui HAS)
  type: Fiche de repérage à cocher
  public: Intervenants et responsables des services à domicile
  lien: https://has-sante.fr/upload/docs/application/pdf/2019-03/fiche-outil_reperage_perte_autonomie.pdf
  lien_label: Fiche sur has-sante.fr
  quoi: "Une fiche à cocher pour signaler les changements observés chez la personne âgée et chez son proche aidant : difficultés dans la vie quotidienne, chutes, alimentation, hygiène, douleurs, fatigue, tristesse, isolement, refus d'intervention. Une partie est réservée au responsable pour noter les actions proposées."
  quand: "Hors situation d'urgence, dès qu'un intervenant à domicile remarque que « quelque chose change »."
  comment:
  - "L'intervenant coche ce qu'il observe, le responsable de secteur en fait la synthèse et propose des actions à la personne."
  - "S'en servir aussi pour repérer l'épuisement du proche aidant."
- id: geva
  cat: evaluation
  titre: "Le GEVA – guide d'évaluation des besoins de compensation des personnes handicapées"
  auteur: CNSA (Caisse nationale de solidarité pour l'autonomie)
  type: Cahier pédagogique
  public: Professionnels qui accompagnent une demande à la MDPH
  lien: https://www.cnsa.fr/sites/default/files/2024-03/PUB_cahierpedagogique_geva_interieur-mai-2015-complet.pdf
  lien_label: Cahier pédagogique sur cnsa.fr
  quoi: "Le cahier qui présente l'outil national d'évaluation des MDPH et ses volets : situation familiale, sociale et budgétaire ; habitat ; parcours de formation et professionnel ; volets médical et psychologique ; activités et capacités fonctionnelles ; aides en place ; synthèse des besoins de compensation."
  quand: "Pour préparer un dossier MDPH ou un écrit qui sera lu par l'équipe pluridisciplinaire de la MDPH."
  comment:
  - "Organiser ses observations selon les volets du GEVA : l'équipe de la MDPH retrouve plus facilement ce dont elle a besoin."
- id: has-essms
  cat: evaluation
  titre: Référentiel d'évaluation de la qualité des établissements et services sociaux et médico-sociaux
  auteur: Haute Autorité de santé (HAS)
  annee: 2022
  type: Référentiel et manuel d'évaluation
  public: Équipes et cadres des établissements et services sociaux et médico-sociaux
  lien: https://has-sante.fr/jcms/p_3323069/fr/mettre-en-oeuvre-l-evaluation-des-essms
  lien_label: Page de la HAS
  quoi: "Le référentiel commun à tous les établissements et services sociaux et médico-sociaux : 3 chapitres, 9 thématiques, 42 objectifs et 157 critères, évalués par trois méthodes (accompagné traceur, traceur ciblé, audit système)."
  quand: "Pour préparer l'évaluation de la qualité de son établissement ou faire le point sur ses pratiques en équipe."
  comment:
  - "Choisir une thématique (par exemple la bientraitance ou le projet personnalisé) et vérifier en équipe comment chaque critère est mis en œuvre."
