  public: Équipes éducatives, police, justice
  image: acpe-vademecum.jpg
  lien: https://www.acpe-asso.org/outils-p%C3%A9dagogiques
  lien_label: Page de l'ACPE
  quoi: "Un guide technique en cinq parties : comprendre et repérer, dispositions légales, rôle de chaque institution, tableau des peines encourues, glossaire."
  quand: "Pour préparer une réunion d'équipe ou un projet de service sur les fugues à répétition, ou pour savoir qui saisir face à une suspicion."
  comment:
  - "Lire la partie « repérer » en équipe et la confronter aux situations rencontrées."
  - "Garder le tableau des infractions à portée de main pour rédiger une information préoccupante ou un signalement."
