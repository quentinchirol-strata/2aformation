  lien_label: Page du Centre Hubertine Auclert
  quoi: "Une règle graduée en trois couleurs (« Profite », « Vigilance, dis stop ! », « Protège-toi, demande de l'aide ») qui permet de mesurer si une relation amoureuse repose sur le consentement et ne comporte pas de violences. Il renvoie vers le 3919 et le tchat d'En Avant Toute(s)."
  quand: "Quand un ou une jeune parle de sa relation amoureuse, ou pour une séance de prévention sur les relations."
  comment:
  - "Le parcourir avec le jeune, situation par situation, en le laissant se positionner."
  - "L'afficher ou le laisser à disposition : il existe en version imprimable, en gros caractères, en braille et en plusieurs langues."
- id: tom-et-lena
