  quoi: "Le numéro national pour les victimes de violences numériques : cyberharcèlement, cybersexisme, diffusion d'images intimes… L'association propose aussi des formations et des interventions."
  quand: "Dès qu'un jeune est harcelé ou que des images de lui circulent en ligne."
  comment:
  - "Donner le numéro au jeune et, si besoin, appeler avec lui."
  - "L'afficher dans les lieux de vie."
