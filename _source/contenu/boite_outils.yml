  quoi: "Un court métrage de 15 minutes et un livret de formation sur les conséquences des violences conjugales pour les enfants, le repérage et l'accompagnement des mères et des enfants victimes."
  quand: "Pour une formation d'équipe ou une réunion sur les enfants co-victimes de violences conjugales."
  comment:
  - "Projeter le film en équipe, puis s'appuyer sur le livret pour travailler le repérage et l'entretien."
