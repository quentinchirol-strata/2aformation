  auteur: Haute Autorité de santé (HAS)
  type: Fiche mémo
  public: Tous professionnels
  image: has-maltraitance.jpg
  lien: https://www.has-sante.fr/jcms/c_1760393/fr/maltraitance-chez-l-enfant-reperage-et-conduite-a-tenir
  lien_label: Page de la HAS
  quoi: "Une fiche mémo : les signes qui doivent faire penser à une maltraitance et la conduite à tenir pour protéger l'enfant."
  quand: "Quand un doute s'installe et qu'il faut savoir quoi observer et à qui transmettre."
  comment:
  - "L'afficher ou la glisser dans le classeur de l'équipe."
  - "S'en servir pour objectiver des observations avant d'en parler en réunion."
- id: cnvif
  cat: danger
  titre: Guide des bonnes pratiques du recueil de la parole de l'enfant
  auteur: Comité national des violences intrafamiliales (CNVIF)
  annee: 2022
  type: Guide
  public: Tout adulte qui reçoit une révélation
  image: cnvif.jpg
  lien: https://www.cnvif.fr/sites/default/files/documents/guide_des_bonnes_pratiques_du_recueil_de_la_parole_de_lenfant_0.pdf
  lien_label: Guide sur le site du CNVIF
  quoi: "Un guide de 16 pages sur l'attitude à adopter quand un enfant révèle des violences : écouter sans questionner de façon suggestive, noter ses mots exacts, transmettre."
  quand: "Avant d'avoir à recueillir une révélation, ou juste après pour vérifier ce qu'il faut consigner."
  comment:
  - "Retenir l'essentiel : croire, ne pas enquêter, noter les mots de l'enfant entre guillemets, transmettre sans délai."
  - "S'en servir comme support d'un temps de formation interne."
