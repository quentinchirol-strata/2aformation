- id: michetometre
  cat: prostitution
  titre: Le Michetomètre
  auteur: ACPE (Agir contre la prostitution des enfants)
  annee: 2025
  type: Support de discussion
  public: Adolescents, avec un professionnel
  image: michetometre.jpg
  lien: https://www.acpe-asso.org/outils-p%C3%A9dagogiques
  lien_label: Page de l'ACPE
  quoi: "Un dépliant qui gradue les situations, des conduites à risque (nudes contre de l'argent, cadeaux en échange de « relations ») à la prostitution et au proxénétisme, avec un petit dictionnaire (michetonnage, loverboy, sugar daddy…) et les numéros utiles."
  quand: "Quand un jeune banalise des échanges « contre » de l'argent, des cadeaux ou un hébergement, ou pour une séance de prévention en petit groupe."
  comment:
  - "Le parcourir avec le jeune, jamais le lui remettre seul : l'ACPE précise qu'il est conçu pour un accompagnement avec un professionnel."
  - "Partir de ses mots : « où te situes-tu ? », « et tes amis ? »."
  - "Rappeler que le mineur en situation de prostitution est une victime, puis orienter (119, dispositif AdoSexo de l'ACPE)."
- id: acpe-vademecum
  cat: prostitution
  titre: "Prostitution des mineurs et fugues : vadémécum à destination des professionnels"
  auteur: ACPE, avec 116 000 Enfants disparus
  type: Guide
  public: Équipes éducatives, police, justice
  image: acpe-vademecum.jpg
  lien: https://www.acpe-asso.org/outils-p%C3%A9dagogiques
  lien_label: Page de l'ACPE
  quoi: "Un guide technique en cinq parties : comprendre et repérer, dispositions légales, rôle de chaque institution, tableau des peines encourues, glossaire."
  quand: "Pour préparer une réunion d'équipe ou un projet de service sur les fugues à répétition, ou pour savoir qui saisir face à une suspicion."
  comment:
  - "Lire la partie « repérer » en équipe et la confronter aux situations rencontrées."
  - "Garder le tableau des infractions à portée de main pour rédiger une information préoccupante ou un signalement."
- id: acpe-parents
  cat: prostitution
  titre: Guide pour les parents
  auteur: ACPE
  type: Guide
  public: Parents
  lien: https://www.acpe-asso.org/outils-p%C3%A9dagogiques
  lien_label: Page de l'ACPE
  quoi: "Un guide pratique pour aider les parents à reconnaître les signaux d'alerte et à se repérer face à la police, à la justice et à la protection de l'enfance."
  quand: "Quand une famille découvre ou soupçonne une exploitation sexuelle de son enfant."
  comment:
  - "Le remettre aux parents lors d'un entretien, en reprenant avec eux les démarches qui les concernent."
- id: has-cnr
  cat: danger
  titre: "Cadre national de référence : la boîte à outils"
  auteur: Haute Autorité de santé (HAS)
  annee: 2021
  type: Fiches et trames
  public: Équipes, cellules de recueil (CRIP), services d'évaluation
  image: has-cnr.jpg
