  lien_label: Page de la HAS
  quoi: "Huit fiches prêtes à l'emploi : trame de recueil d'une information préoccupante, informations à donner aux parents, modèle de journal de bord, conseils pour les entretiens avec les parents et avec l'enfant, trame de rapport d'évaluation, présentation des acteurs."
  quand: "Au moment de rédiger une information préoccupante, de préparer un entretien d'évaluation ou de structurer un rapport."
  comment:
  - "Utiliser la trame n° 1 comme plan pour toute information préoccupante : elle évite les oublis et les jugements."
  - "Relire la fiche « entretien avec l'enfant » avant de rencontrer un enfant."
  - "Vérifier d'abord la trame en usage dans votre département."
- id: has-maltraitance
