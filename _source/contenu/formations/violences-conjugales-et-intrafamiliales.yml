slug: violences-conjugales-et-intrafamiliales
ordre: 15
theme: Violences et situations de danger
nouveau: true
titre: Repérer, comprendre et agir face aux violences conjugales et intrafamiliales
titre_court: Violences conjugales et intrafamiliales
jours: 2
heures: 12
horaires:
- 9h00 – 12h00
- 13h00 – 16h00
intro: Les violences conjugales et intrafamiliales sont un enjeu majeur de santé publique et de protection des personnes. Cette formation permet de repérer les situations de violence, d’en comprendre les mécanismes, d’accompagner les victimes et d’agir de manière adaptée, notamment pour le signalement et l’orientation. Elle associe apports théoriques et mises en situation.
public: Toute personne en contact, dans un cadre professionnel ou bénévole, avec des victimes de violences conjugales ou intrafamiliales.
prerequis: Aucun.
objectifs:
- Identifier les différentes formes de violences et leurs mécanismes
- Analyser les effets de l’emprise et du psycho-traumatisme sur les victimes et les enfants
- Adopter une posture professionnelle bienveillante, éthique et sécurisante
- Évaluer le danger, informer et orienter vers les dispositifs adaptés
- Maîtriser le cadre légal du signalement et coopérer en réseau
programme:
- titre: Les formes de violences et leurs mécanismes
  points:
  - Identifier les violences physiques, psychologiques, verbales, sexuelles, économiques et administratives
  - 'Comprendre l’emprise : isolement, culpabilisation, peur, dépendance affective et économique'
- titre: Emprise et psycho-traumatisme
  points:
  - 'Mesurer les impacts : effets psycho-traumatiques, santé mentale, développement, exposition des enfants'
- titre: La posture professionnelle
  points:
  - Écoute active, non-jugement, neutralité bienveillante
- titre: Évaluer le danger et orienter
  points:
  - 'Évaluer le risque : danger immédiat ou différé pour la victime et son entourage'
- titre: Cadre légal et travail en réseau
  points:
  - Orienter vers les structures spécialisées et travailler en réseau, dans le respect du secret professionnel et du consentement
  - 'Connaître le cadre légal : signalement, responsabilités professionnelles, rédaction'
pedagogie:
- Supports pédagogiques imprimés et/ou numériques
- Apports conceptuels
- Mises en pratique autour de cas concrets
- Partage d’expériences
evaluation:
- Évaluations individuelles à chaud et à froid
- Tour de table en fin de formation
- Retour du formateur
- Analyse des questionnaires
- Vérification de l’atteinte des objectifs par des exercices de mise en pratique
effectif: 10 à 15 personnes
