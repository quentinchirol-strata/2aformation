slug: violences-sexuelles-accueillir-la-parole-des-enfants-en-institution
ordre: 12
theme: Violences et situations de danger
nouveau: true
titre: 'Violences sexuelles : penser sa pratique pour accueillir et accompagner la parole des enfants en institution'
titre_court: 'Violences sexuelles : accueillir la parole des enfants'
jours: 3
heures: 18
intro: 'Cette formation permet aux professionnels du secteur socio-éducatif d’acquérir ou de consolider leurs connaissances sur les violences sexuelles, pour mieux appréhender les situations concernées sur le terrain. Elle s’inscrit dans la politique nationale de prévention et de protection des victimes : mieux comprendre le contexte, mieux repérer les signes d’appel, mieux accompagner la libération de la parole, mieux appréhender les symptômes psycho-traumatiques, mieux gérer les risques de passage à l’acte et mieux identifier l’impact de ces situations sur les professionnels.'
public: Tout professionnel du secteur de la protection de l’enfance.
prerequis: Exercer en protection de l’enfance.
objectifs:
- Connaître les aspects sociétaux, légaux et le cadre juridique des violences sexuelles
- Identifier les besoins de l’enfant victime de violences sexuelles et mieux repérer ses symptômes
- 'Comprendre les transactions violentes : approche systémique des liens violents'
- Comprendre l’organisation complexe des familles incestueuses
- Identifier la place du professionnel en maison d’enfants et les effets sur ceux qui reçoivent la parole de l’enfant
- Se questionner en tenant compte de ses représentations et de sa pratique
programme:
- titre: Le contexte, les aspects légaux et le cadre juridique
  points:
  - 'Connaître le contexte des violences sexuelles : prévalence et définition'
  - Connaître le cadre juridique et les obligations des professionnels
  - Connaître le parcours du signalement et rédiger un écrit à destination du procureur de la République ou de la CRIP
  - 'Connaître le cadre légal : ce que dit la loi, procédure pénale et sanctions'
- titre: Les besoins de l’enfant victime et ses symptômes
  points:
  - 'Repérer un enfant qui va mal : symptômes post-traumatiques et signes d’appel'
  - Connaître les conduites à tenir face à la libération de la parole d’un enfant victime
- titre: Les transactions violentes
  points:
  - Le passage à l’acte
  - 'La mise au secret : la crypte'
  - Le déni et l’inversion de la responsabilité
  - Les effets sur la victime
  - La circulation du traumatisme à travers les générations
- titre: L’organisation des familles incestueuses
  points:
  - 'Décrypter les liens violents transgénérationnels : répétition, reproduction, transmissions, loyautés inconscientes'
  - L’homéostasie familiale
  - La confusion des places dans la famille
  - La place emblématique de la mère
- titre: Les effets sur les professionnels en maison d’enfants
  points:
  - Favoriser l’expression des professionnels qui reçoivent la parole de l’enfant
  - Décrypter l’impact des révélations sur nos représentations et nos croyances
  - 'Repérer la souffrance et l’épuisement face aux situations répétées : le traumatisme vicariant'
- titre: Représentations et pratique
  points:
  - Définir le concept de représentations sociales
  - Analyser une situation vécue à l’aide du génogramme, puis temps de débriefing
pedagogie:
- Supports imprimés et numériques (diaporama)
- Brainstorming
- Apports théoriques, extraits vidéo et MOOC
- Mises en pratique sur cas concrets, avec réalisation d’un génogramme
- Partage d’expériences
horaires:
- 9h00 – 12h00
- 13h00 – 16h00
evaluation:
- Évaluations individuelles à chaud et à froid
- Tour de table en fin de formation
- Retour du formateur
- Analyse des questionnaires
- Vérification de l’atteinte des objectifs par des exercices de mise en pratique
effectif: 10 à 15 personnes
