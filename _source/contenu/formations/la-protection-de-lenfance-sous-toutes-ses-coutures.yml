slug: la-protection-de-lenfance-sous-toutes-ses-coutures
ordre: 7
theme: Protection de l’enfance
titre: La protection de l’enfance sous toutes ses coutures
jours: 3
heures: 18
intro: Cette formation permet aux professionnels de connaître les fondements et le fonctionnement du système de protection de l’enfance en France. Au-delà des règles de fonctionnement, nous proposons un questionnement sur notre rôle de professionnel face à nos représentations.
public: Tout professionnel exerçant dans le secteur de la protection de l’enfance.
prerequis: Exercer auprès d’un public mineur.
objectifs:
- Connaître les fondements de la protection de l’enfance
- Connaître le cadre législatif et questionner son application
- Se questionner en qualité de professionnel en tenant compte de ses représentations
programme:
- titre: Fondements de la protection de l’enfance
  points:
  - Connaître l’origine et les fondements de la protection de l’enfance
- titre: Le cadre législatif
  points:
  - Connaître et comprendre le cadre législatif
  - Mettre en balance les règles et la réalité du terrain
- titre: Exercer sa mission face aux représentations sociales
  points:
  - Comprendre les enjeux de nos représentations dans le cadre de nos missions
  - Se positionner en qualité de professionnel
titre_court: La protection de l’enfance sous toutes ses coutures
nouveau: false
horaires:
- 9h00 – 12h00
- 13h00 – 16h00
pedagogie:
- Supports pédagogiques imprimés et/ou numériques
- Apports conceptuels
- Mises en pratique autour de cas concrets
- Partage d’expériences
evaluation:
- Évaluations individuelles à chaud et à froid
- Tour de table en fin de formation
- Retour du formateur
- Analyse des questionnaires
- Vérification de l’atteinte des objectifs par des exercices de mise en pratique
effectif: 10 à 15 personnes
