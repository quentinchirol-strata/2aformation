slug: mediation-et-entretiens-familiaux
ordre: 11
theme: Posture et pratiques
titre: Médiation et entretiens familiaux
jours: 3
heures: 18
intro: Cette formation aborde la mise en œuvre d’une médiation familiale et d’entretiens familiaux dans le cadre de l’accompagnement des familles.
public: Professionnels du social et du médico-social amenés à accompagner des familles.
prerequis: Aucun.
objectifs:
- Connaître les enjeux des relations intrafamiliales pour mettre en place une médiation familiale
- Mettre en œuvre un protocole de visites encadrées, médiatisées et en présence d’un tiers
- Accompagner les familles dans un cadre éthique et déontologique
- Connaître la législation liée à l’autorité parentale, à la médiation familiale et au secret professionnel
programme:
- titre: Les enjeux des relations intrafamiliales et la médiation familiale
  points:
  - Définir la médiation familiale
  - Comprendre les besoins de l’enfant selon son évolution au sein de sa famille
  - Élaborer un protocole de médiation familiale
  - Repérer et évaluer l’implication du professionnel dans le processus de médiation
- titre: Visites encadrées, médiatisées et en présence d’un tiers
  points:
  - Définir les différents types de visites
  - Définir et comprendre le processus d’attachement
  - Comprendre le processus de séparation et ses enjeux
  - Élaborer un protocole de visite
  - Évaluer et restituer le contenu de la visite à l’enfant, aux parents et aux autres professionnels
- titre: Un accompagnement éthique et déontologique
  points:
  - Savoir adapter sa posture professionnelle
- titre: Le cadre légal
  points:
  - Respecter le secret professionnel et le partager à bon escient dans les limites juridiques
  - Connaître et respecter les droits des parents
  - Connaître la législation sur les droits de visite médiatisés
titre_court: Médiation et entretiens familiaux
nouveau: false
horaires:
- 9h00 – 12h00
- 13h00 – 16h00
pedagogie:
- Supports pédagogiques imprimés et/ou numériques
- Apports conceptuels
- Mises en pratique autour de cas concrets
- Partage d’expériences
evaluation:
- Évaluations individuelles à chaud et à froid
- Tour de table en fin de formation
- Retour du formateur
- Analyse des questionnaires
- Vérification de l’atteinte des objectifs par des exercices de mise en pratique
effectif: 10 à 15 personnes
