slug: la-relation-educative-existe-t-il-de-la-confiance-dans-laccompagnement-specialise
ordre: 2
theme: Posture et pratiques
titre: 'La relation éducative : quelle place pour la confiance dans l’accompagnement spécialisé ?'
titre_court: La relation éducative et la confiance
jours: 2
heures: 12
intro: 'Distance, tiers, confiance : ces mots sont inhérents à la relation éducative. Mais qu’en est-il au contact de publics en difficulté ? Sommes-nous parvenus à instaurer une relation de confiance ? L’accompagnement implique-t-il nécessairement la confiance ? En nous appuyant sur des auteurs comme Guy Hardy, nous réfléchissons à ces notions afin d’améliorer nos pratiques.'
public: Tout professionnel travaillant auprès de personnes (enfants et adultes) dans le domaine de la santé, du social et du médico-social.
prerequis: Être concerné par l’accompagnement de mineurs accueillis en institution (internat, accueil de jour, milieu ouvert…).
objectifs:
- Sensibiliser le professionnel à l’intervention systémique et à l’intervention systémique familiale
- Expérimenter les techniques de base de l’approche systémique
- Identifier les gestes professionnels, les outils et les dispositifs permettant la mise en œuvre d’une relation éducative
programme:
- titre: Développement des compétences relationnelles
  points:
  - Apprendre à établir une relation éducative éthique et respectueuse avec les personnes accompagnées
  - Acquérir des techniques d’observation, d’entretien et de médiation éducative
  - Développer des capacités d’écoute, d’empathie et de communication adaptées
- titre: Compréhension globale des situations
  points:
  - Analyser les besoins, ressources et interactions des personnes dans leur environnement
  - Adopter une vision systémique prenant en compte la personne, sa famille et son contexte social
- titre: Positionnement professionnel
  points:
  - Développer une posture réflexive sur sa pratique
  - Travailler en équipe pluridisciplinaire et en partenariat
  - La confiance dans la relation à l’autre
- titre: Approche systémique
  points:
  - Comprendre les interactions entre l’individu, le groupe et l’institution
  - Articuler l’accompagnement individuel et l’intervention sur le collectif
  - Mobiliser les ressources de l’environnement dans l’action éducative
nouveau: false
horaires:
- 9h00 – 12h00
- 13h00 – 16h00
pedagogie:
- Supports pédagogiques imprimés et/ou numériques
- Apports conceptuels
- Mises en pratique autour de cas concrets
- Partage d’expériences
evaluation:
- Évaluations individuelles à chaud et à froid
- Tour de table en fin de formation
- Retour du formateur
- Analyse des questionnaires
- Vérification de l’atteinte des objectifs par des exercices de mise en pratique
effectif: 10 à 15 personnes
