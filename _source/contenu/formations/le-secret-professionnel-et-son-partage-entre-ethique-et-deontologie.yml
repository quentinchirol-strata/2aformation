slug: le-secret-professionnel-et-son-partage-entre-ethique-et-deontologie
ordre: 1
theme: Posture et pratiques
titre: 'Le secret professionnel et son partage : entre éthique et déontologie'
titre_court: Le secret professionnel et son partage
jours: 2
heures: 12
intro: Cette formation permet aux professionnels de mieux comprendre la notion de secret professionnel et de se questionner plus largement sur le partage d’information dans le travail social et médico-social. Même si les règles sont clairement définies, ce qui se passe sur le terrain est soumis aux nuances de la relation humaine. Nous proposons de parcourir ces règles tout en nous interrogeant sur leur impact dans la vie des personnes accompagnées.
public: Tout professionnel exerçant dans le social ou le médico-social.
prerequis: Aucun.
objectifs:
- Connaître et comprendre la notion de secret professionnel
- Mesurer l’impact de la transmission d’information
- Se questionner sur l’application du cadre législatif d’un point de vue éthique
programme:
- titre: La notion de secret professionnel
  points:
  - Connaître et comprendre le cadre législatif
  - Chercher des sources fiables en matière de législation
- titre: Mesurer l’impact de la transmission d’information
  points:
  - Se positionner en qualité de professionnel
  - Mettre en balance les règles et la réalité du terrain
- titre: Entre éthique et déontologie
  points:
  - Définir et comprendre l’éthique et la déontologie
  - Se questionner sur l’application du cadre en lien avec l’éthique et la déontologie
nouveau: false
horaires:
- 9h00 – 12h00
- 13h00 – 16h00
pedagogie:
- Supports pédagogiques imprimés et/ou numériques
- Apports conceptuels
- Mises en pratique autour de cas concrets
- Partage d’expériences
evaluation:
- Évaluations individuelles à chaud et à froid
- Tour de table en fin de formation
- Retour du formateur
- Analyse des questionnaires
- Vérification de l’atteinte des objectifs par des exercices de mise en pratique
effectif: 10 à 15 personnes
