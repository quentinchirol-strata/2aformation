slug: aborder-la-sexualite-avec-les-mineurs-en-institution
ordre: 3
theme: Violences et situations de danger
titre: Aborder la sexualité avec les mineurs en institution
jours: 2
heures: 12
intro: Cette formation permet aux professionnels d’aborder la sexualité avec les jeunes accueillis en institution, afin de prévenir les risques et d’accompagner au mieux cette dimension dans le cadre du développement psycho-sexuel. Elle invite aussi chaque professionnel à interroger son propre rapport à la sexualité et à connaître les lois en vigueur.
public: Tout professionnel amené à accompagner des mineurs de 3 à 18 ans accueillis en institution en protection de l’enfance.
prerequis: Être concerné par l’accompagnement de mineurs accueillis en institution.
objectifs:
- Pouvoir aborder la question de la sexualité en lien avec le développement psycho-sexuel de l’enfant
- Connaître le cadre légal en matière de sexualité
- Pouvoir se décaler de ses propres représentations de la sexualité
programme:
- titre: Le développement psycho-sexuel de l’enfant
  points:
  - Connaître le développement de l’enfant d’un point de vue théorique
  - Déterminer les besoins selon l’âge de l’enfant
  - Adopter une posture adaptée
- titre: Cadre législatif et éthique
  points:
  - Se positionner en qualité de professionnel
  - Connaître la législation
  - Aborder la notion de consentement
  - Prévenir les risques en matière de sexualité
- titre: Faire face à ses propres représentations de la sexualité
  points:
  - Se questionner par le prisme des représentations sociales
  - Connaître et utiliser des outils liés aux questionnements sur la sexualité
titre_court: Aborder la sexualité avec les mineurs en institution
nouveau: false
horaires:
- 9h00 – 12h00
- 13h00 – 16h00
pedagogie:
- Supports pédagogiques imprimés et/ou numériques
- Apports conceptuels
- Mises en pratique autour de cas concrets
- Partage d’expériences
evaluation:
- Évaluations individuelles à chaud et à froid
- Tour de table en fin de formation
- Retour du formateur
- Analyse des questionnaires
- Vérification de l’atteinte des objectifs par des exercices de mise en pratique
effectif: 10 à 15 personnes
