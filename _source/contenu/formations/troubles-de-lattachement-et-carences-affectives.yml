slug: troubles-de-lattachement-et-carences-affectives
ordre: 8
theme: Protection de l’enfance
titre: Troubles de l’attachement et carences affectives
jours: 2
heures: 12
intro: Cette formation permet aux professionnels d’aborder les concepts de troubles de l’attachement et de carences affectives, et d’en tirer des repères pour l’accompagnement.
public: Tout professionnel exerçant auprès d’enfants.
prerequis: Être concerné par l’accompagnement de mineurs accueillis en institution.
objectifs:
- Connaître les situations pouvant conduire à une carence affective chez l’enfant
- Décrire et repérer les processus psychiques, intellectuels, affectifs et relationnels affectés par les carences affectives
- Identifier les besoins et les difficultés de l’enfant
- Comprendre les conséquences des troubles de l’attachement selon les âges
- Se questionner sur l’accompagnement des enfants, adolescents et adultes ayant connu des troubles de la relation
programme:
- titre: L’attachement, lien essentiel à la construction
  points:
  - Connaître les notions d’attachement et de carences affectives (Spitz, Lemay, Cyrulnik, Bowlby…)
  - Repérer les besoins psychoaffectifs de l’enfant et les conditions d’un développement harmonieux
  - Comprendre les principales situations à l’origine d’une carence affective chez le nourrisson
- titre: Prévenir les carences affectives en cas de placement
  points:
  - Quel accompagnement pour l’enfant et l’adolescent en situation de carence
  - La notion de résilience
  - Prévenir les carences affectives et socio-éducatives
titre_court: Troubles de l’attachement et carences affectives
nouveau: false
horaires:
- 9h00 – 12h00
- 13h00 – 16h00
pedagogie:
- Supports pédagogiques imprimés et/ou numériques
- Apports conceptuels
- Mises en pratique autour de cas concrets
- Partage d’expériences
evaluation:
- Évaluations individuelles à chaud et à froid
- Tour de table en fin de formation
- Retour du formateur
- Analyse des questionnaires
- Vérification de l’atteinte des objectifs par des exercices de mise en pratique
effectif: 10 à 15 personnes
