slug: limpact-des-representations-sociales-dans-nos-pratiques-professionnelles
ordre: 6
theme: Posture et pratiques
titre: L’impact des représentations sociales dans nos pratiques professionnelles
titre_court: Représentations sociales et pratiques professionnelles
jours: 2
heures: 12
intro: Pour proposer un accompagnement de qualité, nous cherchons à partager des pratiques communes. Cette formation invite à questionner la manière dont ces pratiques varient selon qui nous sommes, en abordant l’ensemble de nos pratiques, protocolaires ou non, à travers la notion de représentations sociales.
public: Tout professionnel exerçant dans le social ou le médico-social.
prerequis: Aucun.
objectifs:
- Connaître et comprendre la notion de représentations sociales
- Mesurer l’impact de ces représentations dans sa pratique professionnelle
- Se questionner sur ses pratiques professionnelles
programme:
- titre: La notion de représentation sociale
  points:
  - Connaître et comprendre les représentations professionnelles
- titre: L’impact des représentations dans nos pratiques
  points:
  - Se positionner en qualité de professionnel
  - Analyser des outils permettant d’harmoniser les pratiques professionnelles
- titre: Se questionner sur nos pratiques
  points:
  - Analyser et comprendre nos pratiques collectives
  - Se questionner sur nos pratiques individuelles
nouveau: false
horaires:
- 9h00 – 12h00
- 13h00 – 16h00
pedagogie:
- Supports pédagogiques imprimés et/ou numériques
- Apports conceptuels
- Mises en pratique autour de cas concrets
- Partage d’expériences
evaluation:
- Évaluations individuelles à chaud et à froid
- Tour de table en fin de formation
- Retour du formateur
- Analyse des questionnaires
- Vérification de l’atteinte des objectifs par des exercices de mise en pratique
effectif: 10 à 15 personnes
