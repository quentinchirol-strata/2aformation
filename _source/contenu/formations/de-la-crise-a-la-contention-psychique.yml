slug: de-la-crise-a-la-contention-psychique
ordre: 13
theme: Violences et situations de danger
nouveau: true
titre: 'De la crise à la contention psychique : repères éthiques et pratiques professionnelles'
titre_court: De la crise à la contention psychique
jours: 3
heures: 18
intro: Cette formation permet de réfléchir à l’adaptation de sa posture professionnelle face à la violence dans le social et le médico-social.
public: L’ensemble des professionnels exerçant dans le social et le médico-social.
prerequis: Aucun.
objectifs:
- Identifier les enjeux de la relation éducative face à la violence
- Questionner ses représentations et définir la contention psychique comme réponse à la violence
- Accompagner avec une posture professionnelle éthique et déontologique
- Comprendre la dynamique des groupes restreints et son impact sur la pratique
programme:
- titre: La relation éducative face à la violence
  points:
  - Définir la relation éducative
  - Élaborer une posture en adéquation avec les besoins de la personne et le cadre institutionnel
  - Évaluer l’implication du professionnel et identifier des outils pour favoriser le lien
- titre: Représentations et contention psychique
  points:
  - Définir et comprendre la violence
  - Définir et comprendre la contention physique et psychique
  - Comprendre sa grille de lecture au regard des représentations sociales et professionnelles
  - Comprendre le cadre législatif
  - 'Adapter sa posture et définir un cadre éducatif sécurisant : la cohérence comme contenant psychique'
- titre: Une posture éthique et déontologique
  points:
  - Identifier la crise et utiliser la contention de façon adaptée
  - Définir l’éthique et la déontologie
- titre: La dynamique des groupes restreints
  points:
  - Comprendre les enjeux au sein de l’équipe et du groupe de résidents
  - 'Construire des outils face à la violence : lien entre fonctionnement institutionnel et violence des jeunes'
  - 'Questionner son propre rôle dans la dynamique observée : introduction à la communication non violente'
horaires:
- 9h00 – 12h00
- 13h00 – 16h00
pedagogie:
- Supports pédagogiques imprimés et/ou numériques
- Apports conceptuels
- Mises en pratique autour de cas concrets
- Partage d’expériences
evaluation:
- Évaluations individuelles à chaud et à froid
- Tour de table en fin de formation
- Retour du formateur
- Analyse des questionnaires
- Vérification de l’atteinte des objectifs par des exercices de mise en pratique
effectif: 10 à 15 personnes
