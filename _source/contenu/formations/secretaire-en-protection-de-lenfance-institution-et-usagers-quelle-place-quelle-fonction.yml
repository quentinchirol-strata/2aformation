slug: secretaire-en-protection-de-lenfance-institution-et-usagers-quelle-place-quelle-fonction
ordre: 10
theme: Protection de l’enfance
titre: 'Secrétaires en protection de l’enfance : quelle place, quelle fonction ?'
jours: 3
heures: 18
intro: Cette formation présente aux professionnels administratifs les fondements et le fonctionnement du système de protection de l’enfance en France. Au-delà des règles de fonctionnement, elle propose un questionnement sur leur rôle face aux personnes accueillies et à leurs représentations.
public: Tout professionnel administratif exerçant dans le secteur de la protection de l’enfance.
prerequis: Exercer en protection de l’enfance.
objectifs:
- Connaître les fondements et les dispositifs de la protection de l’enfance
- Connaître le cadre législatif et questionner son application
- Connaître le cadre professionnel du champ d’intervention
- Identifier la place du secrétaire dans le cadre institutionnel
- Se questionner en qualité de professionnel en tenant compte de ses représentations
programme:
- titre: Fondements et dispositifs de la protection de l’enfance
  points:
  - Connaître l’origine de la protection de l’enfance
  - Connaître le fonctionnement de ses dispositifs
- titre: Le cadre législatif
  points:
  - Définir les règles en matière de droit de la famille et de secret professionnel
  - Mettre en balance les règles et la réalité du terrain
- titre: Le cadre professionnel
  points:
  - Se positionner en qualité de professionnel
  - Définir la notion de violence institutionnelle
- titre: La place du secrétaire dans l’institution
  points:
  - Définir les rôles et missions du secrétaire
- titre: Représentations et posture
  points:
  - Définir le concept de représentations sociales
  - Se questionner en qualité de professionnel en tenant compte de ses représentations
titre_court: 'Secrétaires en protection de l’enfance : quelle place, quelle fonction ?'
nouveau: false
horaires:
- 9h00 – 12h00
- 13h00 – 16h00
pedagogie:
- Supports pédagogiques imprimés et/ou numériques
- Apports conceptuels
- Mises en pratique autour de cas concrets
- Partage d’expériences
evaluation:
- Évaluations individuelles à chaud et à froid
- Tour de table en fin de formation
- Retour du formateur
- Analyse des questionnaires
- Vérification de l’atteinte des objectifs par des exercices de mise en pratique
effectif: 10 à 15 personnes
