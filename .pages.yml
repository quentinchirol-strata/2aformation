# Configuration de l'interface d'administration Pages CMS (https://app.pagescms.org)
media:
  input: _source/static/assets/img
  output: assets/img
content:
  - name: site
    label: Informations générales et chiffres
    type: file
    path: _source/contenu/site.yml
    fields:
      - { name: accroche, label: Titre de la page d'accueil, type: string }
      - { name: sous_titre, label: Sous-titre de la page d'accueil, type: text }
      - name: chiffres
        label: Chiffres clés
        type: object
        fields:
          - { name: annee, label: Année des chiffres, type: number }
          - { name: stagiaires, label: Nombre de stagiaires formés, type: number }
          - { name: sessions, label: Nombre de sessions, type: number }
          - { name: satisfaction_formation, label: Satisfaction formations (%), type: number }
          - { name: vae_satisfaction, label: Satisfaction VAE (%), type: number }
          - name: vae_resultats
            label: Résultats VAE par diplôme
            type: object
            list: true
            fields:
              - { name: diplome, label: Diplôme, type: string }
              - { name: presentes, label: Candidats présentés, type: number }
              - { name: diplomes, label: Diplômes complets, type: number }
              - { name: partielles, label: Validations partielles, type: number }
              - { name: abandons, label: Abandons, type: number }
      - name: formations_intra
        label: Tarifs et modalités des formations
        type: object
        fields:
          - { name: prix_jour, label: Prix par jour et par groupe, type: string }
          - { name: prix_participant, label: Équivalent par participant, type: string }
          - { name: effectif, label: Effectif, type: string }
          - { name: delai_acces, label: Délai d'accès, type: string }
          - { name: tva, label: Mention TVA, type: string }
          - { name: deplacement, label: Frais de déplacement, type: string }
      - name: gapp
        label: Analyse des pratiques (GAPP)
        type: object
        fields:
          - { name: tarif, label: Tarif, type: string }
          - { name: effectif, label: Effectif, type: string }
          - { name: duree, label: Durée des séances, type: string }
          - { name: rythme, label: Rythme, type: string }
      - name: equipe
        label: Équipe
        type: object
        list: true
        fields:
          - { name: nom, label: Nom, type: string }
          - { name: role, label: Fonction, type: string }
          - { name: photo, label: Photo, type: image }
          - { name: bio, label: Présentation, type: text }
  - name: vae
    label: VAE (diplômes et formules)
    type: file
    path: _source/contenu/vae.yml
    fields:
      - { name: intro, label: Introduction, type: text }
      - { name: financement, label: Financements, type: string }
      - name: diplomes
        label: Diplômes accompagnés
        type: object
        list: true
        fields:
          - { name: sigle, label: Sigle, type: string }
          - { name: nom, label: Nom du diplôme, type: string }
          - { name: niveau, label: Niveau, type: number }
          - { name: rncp, label: Fiche RNCP, type: string }
      - name: formules
        label: Formules d'accompagnement
        type: object
        list: true
        fields:
          - { name: id, label: Identifiant (sans espace), type: string }
          - { name: titre, label: Titre, type: string }
          - { name: sous_titre, label: Sous-titre, type: string }
          - { name: duree, label: Durée, type: string }
          - { name: prix, label: Prix, type: string }
          - { name: modalites, label: Modalités, type: text }
          - name: etapes
            label: Contenu
            type: object
            list: true
            fields:
              - { name: titre, label: Titre de la partie, type: string }
              - { name: points, label: Points, type: string, list: true }
  - name: formations
    label: Formations
    type: collection
    path: _source/contenu/formations
    format: yaml
    filename: "{fields.slug}.yml"
    view:
      fields: [titre, theme, jours]
    fields:
      - { name: titre, label: Titre complet, type: string, required: true }
      - { name: titre_court, label: Titre court (listes), type: string }
      - { name: slug, label: Adresse de la page (minuscules et tirets), type: string, required: true }
      - name: theme
        label: Thème
        type: select
        options:
          values: ["Protection de l’enfance", "Violences et situations de danger", "Posture et pratiques"]
      - { name: ordre, label: Ordre dans le thème, type: number }
      - { name: nouveau, label: Afficher « Nouveau », type: boolean }
      - { name: publie, label: Publiée sur le site, type: boolean, default: true }
      - { name: jours, label: Nombre de jours, type: number }
      - { name: heures, label: Nombre d'heures, type: number }
      - { name: horaires, label: Horaires, type: string, list: true }
      - { name: effectif, label: Effectif, type: string }
      - { name: intro, label: Présentation, type: text }
      - { name: public, label: Public, type: text }
      - { name: prerequis, label: Prérequis, type: text }
      - { name: objectifs, label: Objectifs, type: string, list: true }
      - name: programme
        label: Programme
        type: object
        list: true
        fields:
          - { name: titre, label: Titre du module, type: string }
          - { name: points, label: Points abordés, type: string, list: true }
      - { name: pedagogie, label: Méthodes pédagogiques, type: string, list: true }
      - { name: evaluation, label: Évaluation, type: string, list: true }
  - name: pages
    label: Pages légales
    type: collection
    path: _source/contenu/pages
    format: yaml-frontmatter
    fields:
      - { name: titre, label: Titre, type: string }
      - { name: chemin, label: Adresse, type: string }
      - { name: description, label: Description, type: string }
      - { name: body, label: Texte, type: rich-text }
